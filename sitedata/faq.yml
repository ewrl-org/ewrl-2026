FAQ:
  - Section: General Questions
    QA:
      - Question: How can I contact the organizers?
        Answer: "You can reach out to us via email at ewrl-2026@inria.fr"
      - Question: My paper is accepted but I do not have an url for the paper yet. What do I do ?
        Answer: "Please say on the "Publication Link" in openreview 'I will send the confirmation by email' and then forward  us (at ewrl-2026@inria.fr) the email in which you got the acceptation for your paper."
